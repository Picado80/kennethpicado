<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Silueta · máscara de la persona</title></head>
<body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920" style="display:block"></canvas>
<script type="module">
// Saca la máscara de la persona de una foto 1080×1920 (?src=), blanco = persona, negro = fondo, con el segmentador de
// MediaPipe (pelo, piel y ropa). Se renderiza como un cuadro con still.mjs y después ffmpeg la usa de canal alfa:
//   ffmpeg -i foto.jpg -i mascara.jpg -filter_complex "[1]format=gray[m];[0][m]alphamerge" persona.png
// Sirve para poner textos y formas DETRÁS de la cara (la persona recortada va encima de todo).
import { FilesetResolver, ImageSegmenter } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const q = new URLSearchParams(location.search);
const img = new Image(); img.src = q.get('src') || 'foto.jpg'; await img.decode();
const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
const seg = await ImageSegmenter.createFromOptions(vision, {
  baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite' },
  outputCategoryMask: true, outputConfidenceMasks: true, runningMode: 'IMAGE' });
const r = seg.segment(img);
const fondo = r.confidenceMasks[0];                         // categoría 0: fondo
const w = fondo.width, h = fondo.height, datos = fondo.getAsFloat32Array();
const chico = new OffscreenCanvas(w, h), cc = chico.getContext('2d'), px = cc.createImageData(w, h);
for (let i = 0; i < w * h; i++) { const v = Math.round(255 * Math.min(1, Math.max(0, (1 - datos[i] - .15) / .7))); px.data.set([v, v, v, 255], i * 4); }
cc.putImageData(px, 0, 0);
const c = document.getElementById('c').getContext('2d');
c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
c.filter = 'blur(1.5px)';
c.drawImage(chico, 0, 0, 1080, 1920);
window.DUR = 1;
window.render = () => {};
window.READY = true;
</script></body></html>
