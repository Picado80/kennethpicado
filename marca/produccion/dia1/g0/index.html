<!doctype html><html lang="es"><head><meta charset="utf-8"><title>G0 · Kenneth no grabó este video</title></head>
<body><div id="escenario" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden"></div>
<script type="module">
// G0 · el gemelo se presenta y lanza el reto. Fondo: el video del gemelo cuadro por cuadro (?fondo=<carpeta>&nf=<cuadros>,
// 30 por segundo); encima, el gancho en tipografía, subtítulos de una línea (27 caracteres como máximo), el sello con
// «hecho con IA» y, al final, el contador del Día 1 (?n=). Todo dentro de la zona segura (SEGURA).
import * as F from './efectos.js';
const { el, C, E, tramo, miles, SEGURA, BOTONES } = F;
const q = new URLSearchParams(location.search);
const FONDO = q.get('fondo') || 'fondo', NF = +(q.get('nf') || 1), N = +(q.get('n') || 1659), DIA = +(q.get('dia') || 1);
await F.instalar();
const T = await (await fetch('tiempos.json')).json();
const W = T.palabras, off = T.offsets;
const esc = document.getElementById('escenario');
const img = el('img', { position: 'absolute', inset: '0', width: '1080px', height: '1920px', objectFit: 'cover' }, esc);
// la cara del gemelo va arriba: los textos grandes van a la altura del pecho, sobre un degradé que no toca la cara
const sombra = el('div', { position: 'absolute', left: '0', right: '0', top: '760px', height: '600px',
  background: 'linear-gradient(rgba(16,27,51,0) 0%, rgba(16,27,51,.82) 35%, rgba(16,27,51,.9) 100%)' }, esc);
const L = SEGURA.izquierda + 10, R = BOTONES.derecha;   // los textos van debajo de y 840: hasta x 780
const sello = el('div', { position: 'absolute', left: `${L}px`, top: `${SEGURA.arriba + 12}px`, fontSize: '28px', color: C.oro,
  background: 'rgba(16,27,51,.72)', padding: '10px 16px', borderRadius: '10px', zIndex: 10 }, esc, `Día ${DIA} de 30 · Hecho con IA`);
sello.className = 'mono';

// 0 · apertura a pantalla completa (?apertura=tipo): la frase sola sobre tinta, como el inicio C del 002 (el que mejor
//     puntuó), y al terminar entra el gemelo con un golpe de zoom
const tipo = q.get('apertura') === 'tipo';
const capaTipo = tipo ? F.frase(el('div', { position: 'absolute', inset: '0', zIndex: 5 }, esc), {
  texto: 'Kenneth no grabó este video.', oro: 'grabó',
  tiempos: W.filter(w => w.tramo === 'a').map(w => Math.max(0, w.s - .06)),
  golpeEn: W.filter(w => w.tramo === 'a')[2].s }) : null;
const raizTipo = tipo ? esc.lastChild : null;

// 1 · el gancho, palabra por palabra con la voz
const gancho = el('div', { position: 'absolute', left: `${L}px`, right: `${R}px`, top: '880px', font: '400 92px/1.0 "Instrument Serif"', color: C.vitela }, esc);
const wa = W.filter(w => w.tramo === 'a');
const spans = wa.map(w => { const s = el('span', { display: 'inline-block', marginRight: '.24em' }, gancho, w.t);
  if (/grab/i.test(w.t) || /^no$/i.test(w.t)) { s.style.color = C.oro; s.style.fontStyle = 'italic'; } return s; });

// 2 · el número de la meta, cuando se dice «1.000»
const wMil = W.find(w => w.tramo === 'c' && /1\.?000|mil/i.test(w.t));
// los números van a la altura de la barba (la boca queda libre) y los subtítulos debajo, todo antes de y 1248
const mil = el('div', { position: 'absolute', left: `${L}px`, right: `${R}px`, top: '950px', color: C.vitela }, esc,
  `<div style="font:400 150px/1 'Instrument Serif';color:${C.oro};font-style:italic">+1.000</div><div class="mono" style="font-size:30px;margin-top:10px">seguidores en 30 días</div>`);

// 3 · el contador del Día N, cuando dice «día uno»
const wUno = W.find(w => w.tramo === 'd' && /uno/i.test(w.t));
const cont = el('div', { position: 'absolute', left: `${L}px`, right: `${R}px`, top: '950px', color: C.vitela }, esc,
  `<div class="mono" style="font-size:28px;color:${C.gris}">Seguidores hoy</div><div style="font:900 160px/1 Archivo;letter-spacing:-.045em">${miles(N)}</div>`);

// 4 · subtítulos de una línea, de hasta 27 caracteres, desde el segundo tramo
const lineas = []; let cur = null;
for (const w of W.filter(w => w.tramo !== 'a')) {
  const t = w.t.replace(/^1\.000$/, 'mil');
  if (!cur || (cur.txt + ' ' + t).length > 27 || cur.tramo !== w.tramo || /[.,:]$/.test(cur.txt)) { cur = { txt: t, s: w.s, e: w.e, tramo: w.tramo }; lineas.push(cur); }
  else { cur.txt += ' ' + t; cur.e = w.e; }
}
lineas.forEach((l, i) => { const sig = lineas[i + 1]; l.hasta = sig ? Math.min(sig.s, l.e + .6) : l.e + .8; });
const sub = el('div', { position: 'absolute', left: `${L}px`, width: `${1080 - L - R}px`, top: '1168px', textAlign: 'center' }, esc);
const pill = el('span', { display: 'inline-block', font: '600 42px/1.2 Archivo', color: C.vitela, background: 'rgba(16,27,51,.86)',
  padding: '12px 26px', borderRadius: '14px' }, sub);

window.DUR = T.total;
window.render = async t => {
  img.src = `${FONDO}/${String(Math.min(NF, 1 + Math.floor(t * 30))).padStart(4, '0')}.jpg`;
  await img.decode();
  const finGancho = off.b - .05;
  if (capaTipo) {
    capaTipo.pintar(t);
    raizTipo.style.opacity = 1 - tramo(t, finGancho, finGancho + .18);
    const z = tramo(t, finGancho, finGancho + .45);                       // el gemelo entra con un golpe de zoom
    img.style.transform = `scale(${1.18 - .18 * E.sale(z)})`;
  }
  spans.forEach((s, i) => { const p = tramo(t, wa[i].s - .06, wa[i].s + .16); s.style.opacity = tipo ? 0 : p * (1 - tramo(t, finGancho, finGancho + .3));
    s.style.transform = `translateY(${(1 - E.sale(p)) * 40}px)`; });
  const ventana = (a, b) => tramo(t, a, a + .25) * (1 - tramo(t, b, b + .3));
  const km = ventana(wMil.s - .05, wMil.s + 1.9);
  mil.style.opacity = km; mil.style.transform = `scale(${1 + .06 * Math.sin(tramo(t, wMil.s - .05, wMil.s + .2) * Math.PI)})`; mil.style.transformOrigin = '0 50%';
  const kc = ventana(wUno.s - .05, T.total + 1);
  cont.style.opacity = kc;
  // la sombra de arriba se queda mientras haya texto grande
  const grande = Math.max(1 - tramo(t, finGancho, finGancho + .3), km, kc);
  sombra.style.opacity = .55 + .45 * grande;
  const l = lineas.find(l => t >= l.s - .05 && t < l.hasta);
  sub.style.opacity = l ? 1 : 0; if (l) pill.textContent = l.txt;
};
await window.render(0);
window.READY = true;
</script></body></html>
