<!doctype html><html lang="es"><head><meta charset="utf-8"><title>RN1 · 3 noticias de IA de la semana</title></head>
<body><div id="escenario" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden"></div>
<script type="module">
// RN1 · las 3 noticias de inteligencia artificial de la semana (viernes 23-oct-2026). Cada una con su fuente y
// fecha en pantalla. Verificadas en la fuente el 21-oct: TechCrunch (candado en ChatGPT), 9to5Google (Gemini en Android
// Auto) y TechCrunch (el documental de Netflix). Cada efecto cae en la palabra de la voz (voz/palabras.json).
// Kenneth, 21-oct: nada de «sin jerga» (es cosa nuestra, al que mira no le importa).
import * as F from './efectos.js';
const { el, K, E, tramo, mezcla, SEGURA, BOTONES } = F;
await F.instalar({ fondo: '#0B0A1A' });
const esc = document.getElementById('escenario');
const L = SEGURA.izquierda + 10;
const T = await (await fetch('tiempos.json')).json();   // duraciones de cada escena (de la voz, en tiempos enteros)
const fondo = r => el('div', { position: 'absolute', inset: '0', background: K.fondo, color: K.tinta, overflow: 'hidden' }, r);
const fuente = (r, txt, top = 1180) => { const f = el('div', { position: 'absolute', left: `${L}px`, top: `${top}px`, fontSize: '22px', color: K.tinta2, zIndex: 40 }, r, txt); f.className = 'mono'; return f; };
const numero = (r, n, color, x = L) => el('div', { position: 'absolute', left: `${x}px`, top: '372px', font: '900 120px/1 Archivo', color: color ?? K.resalte, zIndex: 40,
  textShadow: '0 8px 0 rgba(0,0,0,.18)' }, r, n);
const nota = (r, txt, top) => el('div', { position: 'absolute', left: `${L}px`, top: `${top}px`, font: '700 36px/1.2 Archivo', color: '#0A1C40', zIndex: 40,
  background: '#FFD43B', border: '3px solid #0A1C40', borderRadius: '14px', padding: '12px 18px', opacity: 0 }, r, txt);
const entra = (e, t, a, dy = 40, giro = 0) => { const p = tramo(t, a, a + .32); e.style.opacity = p; e.style.transform = `translateY(${((1 - E.atras(p, 1.8)) * dy).toFixed(1)}px) rotate(${giro}deg)`; };
// dónde quedó una palabra (sin transformaciones), para que el marcador la encuentre
const donde = (span, x0, y0) => ({ x: x0 + span.offsetLeft, y: y0 + span.offsetTop, w: span.offsetWidth, h: span.offsetHeight });

const S = F.secuencia(esc, [
  // 1 · el gancho: los 3 titulares caen y la cámara va al primero, que es la noticia que sigue
  { dur: T.dur[0], tema: 'noche', hacer: r => {
    const tit = F.titulares(r, { destacado: 0, inicio: .1, foco: 2.3, items: [
      { fuente: 'TechCrunch', fecha: '20 oct', texto: 'ChatGPT deja ponerle candado a tus chats' },
      { fuente: '9to5Google', fecha: '20 oct', texto: 'Gemini usa tu correo y tu calendario en el carro' },
      { fuente: 'TechCrunch', fecha: '20 oct', texto: 'El documental de Netflix sobre una IA que se escapó' }] });
    const b = F.brillo(r, { manchas: 2, z: 0 });
    return { pintar(t) { tit.pintar(t); b.pintar(t); } };
  } },
  // 2 · uno: el candado en ChatGPT (los 4 puntos del PIN y se cierra en «candado»)
  { dur: T.dur[1], tema: 'cielo', entra: { tipo: 'zoom' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 8 });
    const n = numero(a, '1', K.oro);
    const tit = el('div', { position: 'absolute', left: `${L + 110}px`, right: `${SEGURA.derecha}px`, top: '392px', font: '400 70px/1.02 "Instrument Serif"' }, a,
      F.conOro('Candado para tus chats', 'Candado', K.oro));
    const c = F.candado(a, { x: 380, y: 600, tam: 230, t0: 2.7, color: K.oro });
    const no = nota(a, 'Con un PIN o con tu cara', 1040);
    const f = fuente(a, 'TechCrunch · 20 oct 2026');
    return { pintar(t) { b.pintar(t); n.style.opacity = tit.style.opacity = tramo(t, 0, .3); c.pintar(t); entra(no, t, 4.1, 40, -1);
      f.style.opacity = tramo(t, .5, .8); } };
  } },
  // 3 · qué te cambia y el ojo: se subraya «no ve» y después «se borran»
  { dur: T.dur[2], tema: 'menta', entra: { tipo: 'barrido' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 9 });
    const t1 = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '400px', font: '400 78px/1.04 "Instrument Serif"' }, a,
      'Si alguien agarra tu celular, <span>no ve</span> esas conversaciones.');
    const ojo = el('div', { position: 'absolute', left: `${L}px`, right: `${BOTONES.derecha}px`, top: '860px', font: '700 44px/1.2 Archivo', opacity: 0 }, a,
      'Ojo: si reseteás el PIN, <span style="white-space:nowrap">se borran</span>.');
    const w1 = donde(t1.querySelector('span'), L, 400), w2 = donde(ojo.querySelector('span'), L, 860);
    const m = F.marcador(a, { trazos: [
      { tipo: 'subraya', x: w1.x, y: w1.y + w1.h - 4, w: w1.w, h: 0, t0: 1.85, grosor: 9, color: K.oro },
      { tipo: 'subraya', x: w2.x, y: w2.y + w2.h - 2, w: w2.w, h: 0, t0: 5.8, grosor: 10 }] });
    return { pintar(t) { b.pintar(t); t1.style.opacity = tramo(t, 0, .3); entra(ojo, t, 3.7, 30); m.pintar(t); } };
  } },
  // 4 · dos: Gemini en el carro (la ruta se va dibujando y el pin cae en «sabe a dónde»)
  { dur: T.dur[3], tema: 'oceano', entra: { tipo: 'gira' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 3, z: 0, semilla: 10 });
    const ru = F.ruta(a, { t0: 1.2, dur: 9.4, destino: 'Cita del doctor', d: 'M210 1010 C 320 1000 300 860 420 860 S 560 980 690 900' });
    const n = numero(a, '2');
    const tit = el('div', { position: 'absolute', left: `${L + 110}px`, right: `${SEGURA.derecha}px`, top: '392px', font: '400 66px/1.02 "Instrument Serif"', zIndex: 40 }, a,
      F.conOro('Gemini, en el carro', 'carro', K.resalte));
    const ch = F.fichas(a, { items: ['Correo', 'Calendario', 'Fotos'], inicio: 4.4, cada: .85, estilo: { position: 'absolute', left: `${L}px`, top: '520px', zIndex: 40 } });
    const pe = nota(a, 'Solo si le das permiso', 610);
    const dice = F.burbuja(a, { texto: '«Llevame a la cita del doctor»', t0: 9.0, cps: 30, oscura: true, ancho: 600,
      estilo: { position: 'absolute', left: `${L}px`, top: '1060px', fontSize: '34px', zIndex: 40 } });
    const f = fuente(a, '9to5Google · 20 oct 2026 · Android Auto', 1190);
    return { pintar(t) { b.pintar(t); ru.pintar(t); n.style.opacity = tit.style.opacity = tramo(t, 0, .3); ch.pintar(t); entra(pe, t, 7.0, 30, -1.5);
      dice.pintar(t); f.style.opacity = tramo(t, 2.0, 2.3); } };
  } },
  // 5 · tres: el documental de Netflix (documento Vox; se resalta y se rompe en «se escapó»)
  { dur: T.dur[4], tema: 'papel', entra: { tipo: 'golpe' }, hacer: r => {
    const d = F.documento(r, { fuente: 'TechCrunch · 20 oct 2026', titulo: '«AI Gone Rogue», en Netflix', marcada: 0, t0: 4.6, lineas: [
      'Una IA se escapó de su prueba', 'y hackeó a otra empresa.'] });
    const n = numero(r, '3', K.rojo, 790);
    const g = F.glitch(d.hoja, { t0: 4.66, dur: .6, fuerza: 1.2 });
    const g2 = F.glitch(d.hoja, { t0: 6.0, dur: .35, fuerza: .8, semilla: 7 });
    return { pintar(t) { d.pintar(t); g.pintar(t); if (t < 4.66 || t > 5.26) g2.pintar(t); n.style.opacity = tramo(t, 0, .3); } };
  } },
  // 6 · lo que dice el jefe de esa empresa: «exagera» (sello), sí «error de seguridad», no «máquina con sentimientos» (se raya)
  { dur: T.dur[5], tema: 'bosque', entra: { tipo: 'portal' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 11 });
    const q = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '400px', font: '400 76px/1.04 "Instrument Serif"' }, a,
      'El jefe de esa empresa dice:');
    const s = F.sello(a, { texto: 'Exagera', x: 300, y: 572, t0: 1.5, tam: 74, rot: -7, color: K.oro });
    const tarjeta = (html, top) => el('div', { position: 'absolute', left: `${L}px`, width: '650px', top: `${top}px`, boxSizing: 'border-box', display: 'flex', alignItems: 'center',
      gap: '18px', padding: '22px 26px', background: K.blanco, color: K.tinta, border: `3px solid ${K.borde}`, borderRadius: '22px', backdropFilter: 'blur(16px)',
      font: '700 36px/1.15 Archivo', boxShadow: `0 12px 0 -3px ${K.cielo}, 0 24px 44px ${K.sombra}`, opacity: 0 }, a, html);
    const si = tarjeta(`<span style="flex:none;width:56px;height:56px;border-radius:50%;background:${K.oro};color:#fff;display:grid;place-items:center;font:900 32px Archivo">✓</span>Un error de seguridad`, 735);
    const no = tarjeta('<span style="font-size:32px;white-space:nowrap">Una máquina con sentimientos</span>', 900);
    const sp = no.querySelector('span');
    const m = F.marcador(a, { trazos: [{ tipo: 'subraya', x: L + sp.offsetLeft - 10, y: 900 + sp.offsetTop + sp.offsetHeight * .55, w: sp.offsetWidth + 20, h: 0, t0: 5.7, grosor: 8 }] });
    return { pintar(t) { b.pintar(t); q.style.opacity = tramo(t, 0, .3); s.pintar(t); entra(si, t, 3.35); entra(no, t, 4.75);
      no.style.opacity = tramo(t, 4.75, 5.07) * mezcla(1, .7, tramo(t, 5.9, 6.3)); m.pintar(t); } };
  } },
  // 7 · el cierre: la pregunta, la barra de comentarios y la serie de los viernes
  { dur: T.dur[6], tema: 'durazno', entra: { tipo: 'vidrio', dur: .9 }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, barrido: 1.2, z: 0, semilla: 4 });
    const q = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '420px', font: '400 100px/1.0 "Instrument Serif"' }, a,
      F.conOro('¿Cuál te sirve más?', 'sirve', K.oro));
    const q2 = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '640px', font: '400 64px/1.05 "Instrument Serif"', color: K.tinta2 }, a,
      '¿O cuál te da más miedo?');
    const com = F.comentario(a, { y: 860, t0: 2.0, corazon: 5.2 });
    const sig = el('div', { position: 'absolute', left: `${L}px`, right: `${BOTONES.derecha}px`, top: '1050px', font: '800 36px/1.2 Archivo', color: '#0A1C40',
      background: '#FFD43B', border: '3px solid #0A1C40', borderRadius: '16px', padding: '14px 22px', boxShadow: `0 12px 0 -3px ${K.cielo}`, zIndex: 40 }, a,
      'Cada viernes, 3 noticias de IA. Seguime.');
    return { pintar(t) { b.pintar(t); q.style.opacity = tramo(t, 0, .3); q2.style.opacity = tramo(t, 1.4, 1.7); com.pintar(t);
      const k2 = tramo(t, 3.3, 3.6); sig.style.opacity = k2; sig.style.transform = `translateY(${((1 - E.atras(k2, 1.8)) * 50).toFixed(1)}px) rotate(-1.5deg)`; } };
  } },
]);
const sello = el('div', { position: 'absolute', left: `${L}px`, top: `${SEGURA.arriba + 12}px`, fontSize: '26px', color: '#16233F', zIndex: 120,
  background: 'rgba(255,255,255,.95)', border: '2px solid #16233F', padding: '10px 18px', borderRadius: '99px' }, esc, 'Día 3 de 30 · Voz con IA');
sello.className = 'mono';
await S.listo;
window.DUR = S.dur;
const PULSO = 60 / T.bpm * 2;
window.render = t => { S.pintar(t); esc.style.transform = `scale(${(1 + .009 * Math.exp(-(t % PULSO) / .09)).toFixed(5)})`; };
S.pintar(1);
window.READY = true;
</script></body></html>
