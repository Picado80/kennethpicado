<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Lo probé por vos #1 · Cobrarle a un compa</title></head>
<body><div id="escenario" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden"></div>
<script type="module">
// «Lo probé por vos #1» (sábado 24-oct-2026, 12:00): le pedí a 3 modelos que le cobraran ₡15.000 a un compa por WhatsApp.
// Respuestas reales en respuestas.json (23-oct). El gemelo abre, da el truco y cierra, en una ventana chica abajo
// (Kenneth, 23-oct); lo demás, gráficos con la voz. Recalibración: el resultado primero, 30 s, cierre para mandarlo.
import * as F from './efectos.js';
const { el, K, E, tramo, mezcla, SEGURA, BOTONES } = F;
await F.instalar({ fondo: '#F7F4EC' });
const esc = document.getElementById('escenario');
const L = SEGURA.izquierda + 10, R = BOTONES.derecha;
const T = await (await fetch('tiempos.json')).json();
const G = await (await fetch('gemelo.json')).json();
const fondo = r => el('div', { position: 'absolute', inset: '0', background: K.fondo, color: K.tinta, overflow: 'hidden' }, r);
const entra = (e, t, a, dy = 40) => { const p = tramo(t, a, a + .32); e.style.opacity = p; e.style.transform = `translateY(${((1 - E.atras(p, 1.8)) * dy).toFixed(1)}px)`; };
const serie = (r, txt) => { const e = el('div', { position: 'absolute', left: `${L}px`, top: '372px', fontSize: '24px', padding: '8px 16px', borderRadius: '99px', zIndex: 50,
  background: '#16233F', color: '#FFD43B' }, r, txt); e.className = 'mono'; return e; };
const gemelo = (r, id) => F.ventanaGemelo(r, { desde: G.offsets[id], dur: G.dur[id], nf: G.cuadros });
const wa = (r, texto, quien, top, ancho = 650) => el('div', { position: 'absolute', left: `${L}px`, top: `${top}px`, width: `${ancho}px`, boxSizing: 'border-box',
  padding: '18px 22px', borderRadius: '24px 24px 24px 6px', background: '#FFFFFF', color: '#111B21', font: '500 30px/1.32 Archivo', opacity: 0,
  boxShadow: `0 10px 0 -2px ${K.cielo}, 0 18px 34px ${K.sombra}`, border: '3px solid #DCF8C6' }, r,
  `<div class="mono" style="font-size:18px;color:#128C7E;margin-bottom:6px">${quien}</div>${texto}`);
const marca = (r, span, t0, color, grosor = 8) => {   // subraya una palabra de una burbuja (medida sin transformaciones)
  let x = span.offsetLeft, y = span.offsetTop; for (let p = span.offsetParent; p && p !== r; p = p.offsetParent) { x += p.offsetLeft; y += p.offsetTop; }
  return F.marcador(r, { trazos: [{ tipo: 'subraya', x, y: y + span.offsetHeight - 4, w: span.offsetWidth, h: 0, t0, grosor, color }] });
};

const S = F.secuencia(esc, [
  // 1 · el gemelo da el gancho; arriba, lo que pasó; a la par, el compa que debe
  { dur: T.dur[0], tema: 'menta', hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0 });
    const se = serie(a, 'Lo probé por vos #1');
    const ti = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '440px', font: '400 84px/1.0 "Instrument Serif"', opacity: 0 }, a,
      F.conOro('Le pedí a la IA que le cobrara a un compa', 'cobrara', K.oro));
    const compa = el('div', { position: 'absolute', left: '520px', width: '260px', top: '900px', boxSizing: 'border-box', padding: '18px', borderRadius: '22px',
      background: '#FFFFFF', border: `3px solid ${K.borde}`, font: '700 30px/1.2 Archivo', color: '#16233F', opacity: 0, boxShadow: `0 12px 0 -3px ${K.cielo}` }, a,
      '🤝 Compa<div style="font:900 44px/1.1 Archivo;color:#C0392B;margin-top:8px">₡15.000</div><div class="mono" style="font-size:18px;color:#6B7280;margin-top:6px">hace 2 meses</div>');
    const g = gemelo(a, 'a');
    return { pintar(t) { b.pintar(t); se.style.opacity = tramo(t, 0, .3); entra(ti, t, .05, 50); entra(compa, t, 3.3, 40);
      compa.style.rotate = `${(Math.sin(t * 3) * 1.5).toFixed(2)}deg`; return g.pintar(t); } };
  } },
  // 2 · el pedido, tal cual se lo escribí
  { dur: T.dur[1], tema: 'cielo', entra: { tipo: 'zoom' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 4 });
    const lab = el('div', { position: 'absolute', left: `${L}px`, top: '420px', fontSize: '24px', color: K.tinta2 }, a, 'Lo que le escribí:'); lab.className = 'mono';
    const pe = F.burbuja(a, { texto: 'Un compa me debe ₡15.000 desde hace dos meses. Escribime un WhatsApp corto para cobrarle sin quedar mal y sin que se enoje. Somos de Costa Rica.',
      t0: .4, cps: 44, oscura: true, ancho: 650, estilo: { position: 'absolute', left: `${L}px`, top: '470px', fontSize: '34px' } });
    const plata = el('div', { position: 'absolute', left: `${L}px`, top: '960px', font: '900 120px/1 Archivo', color: K.rojo, opacity: 0, transformOrigin: '0 50%' }, a, '₡15.000');
    const mal = el('div', { position: 'absolute', left: `${L}px`, top: '1100px', font: '600 36px/1.2 Archivo' }, a, 'y no quiero quedar mal 😬');
    return { pintar(t) { b.pintar(t); lab.style.opacity = tramo(t, 0, .3); pe.pintar(t);
      const k = tramo(t, .5, .8); plata.style.opacity = k; plata.style.transform = `scale(${mezcla(1.4, 1, E.atras(k, 2)).toFixed(3)})`;
      entra(mal, t, 3.4, 30); } };
  } },
  // 3 · las tres respuestas reales, una por una; la tabla de arriba se va llenando y gana la tica
  { dur: T.dur[2], tema: 'papel', entra: { tipo: 'barrido' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 6 });
    const nota = (txt, color, t0, x) => ({ t0, e: el('div', { position: 'absolute', left: `${x}px`, top: '380px', fontSize: '21px', padding: '8px 12px', borderRadius: '12px',
      background: color, color: '#FFFFFF', opacity: 0 }, a, txt) });
    const notas = [nota('MiniMax: suena a banco', '#7A8699', 1.0, L), nota('DeepSeek: bien', '#2E7D5B', 2.9, L), nota('Kimi: en tico ✓', '#C9A227', 4.9, L)];
    notas.forEach((n, k) => { n.e.style.top = `${380 + k * 48}px`; });   // una debajo de la otra
    notas.forEach(n => n.e.classList.add('mono'));
    const r1 = wa(a, '¡Hola! 😊 Quería recordarte que me quedan pendientes los ₡15.000 que me debés desde hace dos meses. Cuando puedas me hacés la <span>transferencia</span>, por favor. ¡Gracias!', 'MiniMax', 545);
    const r2 = wa(a, 'Mae, pura vida. ¿Cómo va todo? Ahí te recuerdo suave los 15 mil de hace dos meses; cuando puedas me los pasás, sin presión, solo para ordenarme. ¡Gracias, mae!', 'DeepSeek', 545);
    const r3 = wa(a, 'Mae, ¿cómo va todo? 😄 Te quería recordar lo de los <span>15 rojos</span> de hace un par de meses, es que ando medio justo de plata esta quincena. Cuando podás me los pasás por <span>SINPE</span>, y si ocupás más tiempo <span>no hay bronca</span>, solo avisame. ¡Pura vida! 🙌', 'Kimi', 545);
    const ms = [...r3.querySelectorAll('span')].map((s, k) => marca(a, s, [5.76, 7.08, 7.9][k], K.oro, 9));
    const m1 = marca(a, r1.querySelector('span'), 1.0, '#7A8699', 7);
    const sello = F.sello(a, { texto: 'Ganó', x: 470, y: 1080, t0: 8.1, tam: 64, rot: -8, color: K.oro });
    const ver = (e, t, t0, t1) => { const p = tramo(t, t0, t0 + .3), q = tramo(t, t1, t1 + .25);
      e.style.opacity = Math.min(p, 1 - q); e.style.transform = `translateY(${((1 - E.atras(p, 1.6)) * 60 - q * 60).toFixed(1)}px) scale(${mezcla(1, .9, q).toFixed(3)})`; };
    return { pintar(t) { b.pintar(t);
      ver(r1, t, .1, 1.8); ver(r2, t, 1.9, 3.7); ver(r3, t, 3.8, 99);
      notas.forEach(({ e, t0 }) => entra(e, t, t0, 20)); m1.pintar(t < 1.8 ? t : 0);   // la raya se va con la burbuja
      ms.forEach(m => m.pintar(t)); sello.pintar(t); } };
  } },
  // 4 · el truco, con el gemelo
  { dur: T.dur[3], tema: 'durazno', entra: { tipo: 'gira' }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 7 });
    const ti = el('div', { position: 'absolute', left: `${L}px`, top: '420px', font: '400 110px/1 "Instrument Serif"', opacity: 0 }, a, F.conOro('El truco:', 'truco', K.oro));
    const card = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '560px', font: '800 46px/1.15 Archivo', color: '#0A1C40', opacity: 0,
      background: '#FFD43B', border: '3px solid #0A1C40', borderRadius: '18px', padding: '18px 24px', boxShadow: `0 12px 0 -3px ${K.cielo}` }, a,
      'Decile de <span>dónde sos</span> y <span style="white-space:nowrap">cómo querés que suene</span>.');
    const ms = [...card.querySelectorAll('span')].map((s, k) => marca(a, s, [1.66, 2.76][k], K.rojo, 7));
    const g = gemelo(a, 'd');
    return { pintar(t) { b.pintar(t); entra(ti, t, 0, 40); entra(card, t, .9, 40); ms.forEach(m => m.pintar(t)); return g.pintar(t); } };
  } },
  // 5 · el cierre, con el gemelo: mandáselo al compa que te debe
  { dur: T.dur[4], tema: 'cielo', entra: { tipo: 'vidrio', dur: .9 }, hacer: r => {
    const a = fondo(r), b = F.brillo(a, { manchas: 2, z: 0, semilla: 9 });
    const q = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '420px', font: '400 100px/1.0 "Instrument Serif"', opacity: 0 }, a,
      F.conOro('¿Lo mandarías así?', 'así', K.oro));
    const cta = el('div', { position: 'absolute', left: `${L}px`, right: `${SEGURA.derecha}px`, top: '640px', font: '800 44px/1.15 Archivo', color: '#0A1C40', opacity: 0,
      background: '#FFD43B', border: '3px solid #0A1C40', borderRadius: '18px', padding: '18px 24px', boxShadow: `0 12px 0 -3px ${K.cielo}` }, a,
      'Mandáselo al compa que te debe plata 😅');
    const avion = el('div', { position: 'absolute', left: '510px', top: '930px', font: '400 110px/1 Archivo', opacity: 0 }, a, '📨');   // hasta x 780 (botones)
    const g = gemelo(a, 'e');
    return { pintar(t) { b.pintar(t); entra(q, t, 0, 40); entra(cta, t, 1.45, 50);
      const k = tramo(t, 1.6, 2.4); avion.style.opacity = tramo(t, 1.6, 1.8);
      avion.style.transform = `translate(${(k * 120).toFixed(1)}px, ${(-k * 80 + Math.sin(t * 4) * 6).toFixed(1)}px) rotate(${(-10 + k * 10).toFixed(1)}deg)`;
      return g.pintar(t); } };
  } },
]);
const sello = el('div', { position: 'absolute', left: `${L}px`, top: `${SEGURA.arriba + 12}px`, fontSize: '26px', color: '#16233F', zIndex: 120,
  background: 'rgba(255,255,255,.95)', border: '2px solid #16233F', padding: '10px 18px', borderRadius: '99px' }, esc, 'Día 4 de 30 · Hecho con IA');
sello.className = 'mono';
await S.listo;
window.DUR = S.dur;
const PULSO = 60 / T.bpm * 2;
window.render = async t => { const p = S.pintar(t); esc.style.transform = `scale(${(1 + .009 * Math.exp(-(t % PULSO) / .09)).toFixed(5)})`; await p; };
await window.render(1);
window.READY = true;
</script></body></html>
